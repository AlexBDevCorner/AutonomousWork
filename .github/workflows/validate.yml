name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate control repo
        run: dotnet run --project tools/AutonomousWork.Cli -- validate
      - name: Run CLI tests
        run: dotnet test AutonomousWork.sln --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test orchestration without GitHub writes
        run: node --test tools/autonomy/*.test.mjs
      - name: Test Supabase review-bridge delivery (no network or credentials)
        run: node --test tools/review-bridge/*.test.mjs
      - name: Validate automation configuration
        run: |
          dotnet build tools/AutonomousWork.Cli -c Release --nologo
          node tools/autonomy/run.mjs --validate
