name: GitHub App authentication test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
          permission-actions: write
          permission-contents: read
          permission-pull-requests: read

      - name: Verify RepoManager access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/AlexBDevCorner/RepoManager

      - name: Verify Actions access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/AlexBDevCorner/RepoManager/actions/workflows
