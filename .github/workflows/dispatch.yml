name: Autonomous dispatcher and reconciler
on:
  workflow_dispatch:
    inputs:
      retry_task:
        description: "Blocked task ID to retry; leave empty for normal dispatch"
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
    paths:
      - automation/dispatcher-heartbeat.txt

concurrency:
  group: autonomous-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  control:
    # Paused during GitHub Actions billing investigation. Restore original guard to resume.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build tools/AutonomousWork.Cli -c Release --nologo
      - run: node tools/autonomy/run.mjs --validate
      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: write
          permission-actions: write
          permission-pull-requests: read
          permission-checks: read
      - name: Reconcile and select work
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RETRY_TASK: ${{ inputs.retry_task }}
        shell: bash
        run: |
          if [ -n "$RETRY_TASK" ]; then
            node tools/autonomy/run.mjs --apply --retry "$RETRY_TASK"
          else
            node tools/autonomy/run.mjs --apply
          fi
      - name: Publish operator summary
        if: always()
        shell: bash
        run: test ! -f automation/STATUS.md || cat automation/STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-status
          path: |
            automation/STATUS.md
            automation/review-queue.json
