name: Autonomous dispatcher and reconciler
on:
  workflow_dispatch:
    inputs:
      retry_task:
        description: "Blocked task ID to retry; leave empty for normal dispatch"
        required: false
        default: ''
        type: string
      resume_correction_task:
        description: "Operator-resolved blocked correction task; requires review/head/resolution pins"
        required: false
        default: ''
        type: string
      review_id:
        description: "Exact current CHANGES_REQUESTED review ID for operator recovery"
        required: false
        default: ''
        type: string
      expected_head:
        description: "Exact unchanged reviewed PR head SHA for operator recovery"
        required: false
        default: ''
        type: string
      resolution_url:
        description: "Trusted human resolution comment URL on the task PR"
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
    paths:
      - automation/dispatcher-heartbeat.txt

concurrency:
  group: autonomous-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  control:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build tools/AutonomousWork.Cli -c Release --nologo
      - run: node tools/autonomy/run.mjs --validate
      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: write
          permission-actions: write
          permission-pull-requests: read
          permission-checks: read
      - name: Reconcile and select work
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RETRY_TASK: ${{ inputs.retry_task }}
          RESUME_CORRECTION_TASK: ${{ inputs.resume_correction_task }}
          REVIEW_ID: ${{ inputs.review_id }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RESOLUTION_URL: ${{ inputs.resolution_url }}
        shell: bash
        run: |
          args=(--apply)
          if [ -n "$RETRY_TASK" ]; then args+=(--retry "$RETRY_TASK"); fi
          if [ -n "$RESUME_CORRECTION_TASK" ]; then args+=(--resume-correction "$RESUME_CORRECTION_TASK"); fi
          if [ -n "$REVIEW_ID" ]; then args+=(--review-id "$REVIEW_ID"); fi
          if [ -n "$EXPECTED_HEAD" ]; then args+=(--expected-head "$EXPECTED_HEAD"); fi
          if [ -n "$RESOLUTION_URL" ]; then args+=(--resolution-url "$RESOLUTION_URL"); fi
          node tools/autonomy/run.mjs "${args[@]}"
      - name: Publish operator summary
        if: always()
        shell: bash
        run: test ! -f automation/STATUS.md || cat automation/STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-status
          path: |
            automation/STATUS.md
            automation/review-queue.json
