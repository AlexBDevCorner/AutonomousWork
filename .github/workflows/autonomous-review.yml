name: Autonomous OpenCode reviewer
# Dispatched by the deterministic dispatcher for one eligible exact PR head.
# The unique run name is how the dispatcher deduplicates and bounds retries.
run-name: ${{ inputs.mode == 'merge_check' && 'merge-check' || 'review' }} ${{ inputs.task_id }} ${{ inputs.head_sha }}${{ inputs.supersedes_review_id && format(' after {0}', inputs.supersedes_review_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "review (OpenCode model) or merge_check (model-free, existing approval)"
        type: choice
        required: true
        default: review
        options: [review, merge_check]
      task_id:
        description: "Task ID in review"
        required: true
        type: string
      project_id:
        description: "Control project ID"
        required: true
        type: string
      repository:
        description: "Target Owner/Repo"
        required: true
        type: string
      pr:
        description: "Recorded autonomous PR number"
        required: true
        type: string
      head_sha:
        description: "Exact PR head SHA with green required CI"
        required: true
        type: string
      supersedes_review_id:
        description: "Overturned review ID for a same-SHA re-review after binding arbitration"
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: opencode-review-${{ inputs.repository }}-${{ inputs.pr }}
  cancel-in-progress: false

env:
  TASK_ID: ${{ inputs.task_id }}
  PROJECT_ID: ${{ inputs.project_id }}
  REPOSITORY: ${{ inputs.repository }}
  PR: ${{ inputs.pr }}
  HEAD_SHA: ${{ inputs.head_sha }}
  SUPERSEDES_REVIEW_ID: ${{ inputs.supersedes_review_id }}
  # Reviewer model is independent from the coding worker and the #35 arbiter.
  REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
  REVIEWER_VARIANT: ${{ vars.REVIEWER_VARIANT || 'max' }}

jobs:
  # Holds the model credential and untrusted PR files. No GitHub write token,
  # and the PR checkout is read as data, never executed.
  review:
    if: github.ref == 'refs/heads/master' && vars.AUTONOMOUS_REVIEW_ENABLED == 'true' && inputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      eligible: ${{ steps.prepare.outputs.eligible }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run review guard tests
        run: node --test control/tools/review-bridge/*.test.mjs
      - name: Obtain cross-repo READ-ONLY worker App token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Check eligibility with bridge guards and collect evidence
        id: prepare
        working-directory: control
        env:
          GITHUB_TOKEN_READ: ${{ steps.read-token.outputs.token }}
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: node tools/review-bridge/opencode-review.mjs prepare
      - name: Check out exact PR head as data
        if: steps.prepare.outputs.eligible == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble read-only review workspace
        if: steps.prepare.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: bash control/tools/review-bridge/workspace.sh pr "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/evidence"
      - name: Install pinned OpenCode CLI
        if: steps.prepare.outputs.eligible == 'true'
        run: |
          npm install --global opencode-ai@1.18.35
          opencode --version
      - name: Confirm configured model and variant are available
        if: steps.prepare.outputs.eligible == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # A fresh runner only has the CLI's bundled catalog, which lacks newer models.
          opencode models --refresh > /dev/null
          opencode models "${REVIEWER_MODEL%%/*}" --verbose > "$RUNNER_TEMP/models.txt"
          node control/tools/review-bridge/opencode-review.mjs check-model "$RUNNER_TEMP/models.txt" "$REVIEWER_MODEL" "$REVIEWER_VARIANT"
      - name: Run OpenCode reviewer with read-only tools
        if: steps.prepare.outputs.eligible == 'true'
        timeout-minutes: 35
        working-directory: pr
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{"permission":{"read":"allow","glob":"allow","grep":"allow","list":"allow","edit":"deny","bash":"deny","task":"deny","external_directory":"deny","todowrite":"deny","webfetch":"deny","websearch":"deny","lsp":"deny","skill":"deny","question":"deny","doom_loop":"deny"}}'
        shell: bash
        run: |
          set -euo pipefail
          opencode run --model "$REVIEWER_MODEL" --variant "$REVIEWER_VARIANT" \
            "$(cat ../control/reviewer/OPENCODE_REVIEW.md)" 2>&1 | tee "$RUNNER_TEMP/opencode.log"
      - name: Record model token usage and cost
        if: always() && steps.prepare.outputs.eligible == 'true'
        shell: bash
        # A fresh runner holds only this run's session, so the stats are this run's usage.
        run: |
          command -v opencode > /dev/null || exit 0
          { echo '### Model usage'; echo '```'; opencode stats --models | sed 's/\x1b\[[0-9;]*[A-Za-z]//g'; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Validate structured verdict
        if: steps.prepare.outputs.eligible == 'true'
        env:
          VERDICT_FILE: ${{ runner.temp }}/verdict/verdict.json
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/verdict"
          node control/tools/review-bridge/opencode-review.mjs parse "$RUNNER_TEMP/opencode.log"
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.eligible == 'true'
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict/verdict.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outputs.eligible == 'true'
        with:
          name: opencode-log
          path: ${{ runner.temp }}/opencode.log
          retention-days: 14
          if-no-files-found: ignore

  # Model-free: an exact head with a trusted approval only needs the bridge's guarded merge.
  merge-check:
    if: github.ref == 'refs/heads/master' && vars.AUTONOMOUS_REVIEW_ENABLED == 'true' && inputs.mode == 'merge_check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain cross-repo READ-ONLY worker App token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Obtain MERGE worker App token
        id: merge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: write
          permission-pull-requests: write
      - name: Guarded merge of the trusted exact-head approval
        env:
          GITHUB_TOKEN_READ: ${{ steps.read-token.outputs.token }}
          MERGE_GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          AUTONOMOUS_REVIEW_ENABLED: ${{ vars.AUTONOMOUS_REVIEW_ENABLED }}
        run: node tools/review-bridge/opencode-review.mjs merge-check

  # Trusted, model-free, no PR code: re-validates the verdict against live GitHub/control
  # state, then posts the commit-bound review and guarded merge with the bridge's own writers.
  apply:
    needs: review
    if: needs.review.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain cross-repo READ-ONLY worker App token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Obtain MERGE worker App token
        id: merge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/download-artifact@v4
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict
      - name: Re-validate verdict, post review, guarded merge
        env:
          GITHUB_TOKEN_READ: ${{ steps.read-token.outputs.token }}
          MERGE_GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          AUTONOMOUS_REVIEWER_TOKEN: ${{ secrets.AUTONOMOUS_REVIEWER_TOKEN }}
          AUTONOMOUS_REVIEW_ENABLED: ${{ vars.AUTONOMOUS_REVIEW_ENABLED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/review-bridge/opencode-review.mjs apply "$RUNNER_TEMP/verdict/verdict.json"
