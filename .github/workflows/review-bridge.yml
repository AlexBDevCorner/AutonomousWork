name: Autonomous PR Review Bridge

on:
  repository_dispatch:
    types: [autonomous_review_test_inserted, autonomous_review_inserted]
  workflow_dispatch:
    inputs:
      queue_id:
        description: "Existing Supabase queue UUID to inspect or recover"
        required: true
        type: string
      mode:
        description: "test-only diagnostics or live autonomous review"
        type: choice
        required: true
        default: live
        options: [test, live]

permissions:
  contents: read

concurrency:
  group: review-bridge-${{ github.event.client_payload.queue_id || inputs.queue_id }}
  cancel-in-progress: false

jobs:
  # This mode is intentionally mandatory dry-run. NO PR write permissions,
  # NO checkout of untrusted PR-head code and NO Supabase admin key in GitHub.
  deterministic-dry-run:
    if: github.ref == 'refs/heads/master' && (github.event.action == 'autonomous_review_test_inserted' || inputs.mode == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUEUE_ID: ${{ github.event.client_payload.queue_id || inputs.queue_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic review guards and queue claims
        run: node --test tools/review-bridge/*.test.mjs
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Validate current master and exact GitHub head, record result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_BRIDGE_QUEUE_TOKEN: ${{ secrets.REVIEW_BRIDGE_QUEUE_TOKEN }}
        run: node tools/review-bridge/processor.mjs

  # Final live reviewer. Per-project authorization comes from control config.
  review:
    if: >-
      github.ref == 'refs/heads/master' &&
      vars.AUTONOMOUS_REVIEW_ENABLED == 'true' &&
      (github.event.action == 'autonomous_review_inserted' || inputs.mode == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QUEUE_ID: ${{ github.event.client_payload.queue_id || inputs.queue_id }}
      AUTONOMOUS_REVIEW_ENABLED: ${{ vars.AUTONOMOUS_REVIEW_ENABLED }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run review and merge guard tests
        run: node --test tools/review-bridge/*.test.mjs
      - name: Obtain cross-repo READ-ONLY worker App token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            AutonomousWork
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Obtain MERGE worker App token
        id: merge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: |
            RepoManager
            MandarinBotNet
            MtgSoloSports
          permission-contents: write
          permission-pull-requests: write
      - name: Apply real review and guarded merge
        env:
          READ_GH_TOKEN: ${{ steps.read-token.outputs.token }}
          MERGE_GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          REVIEW_BRIDGE_QUEUE_TOKEN: ${{ secrets.REVIEW_BRIDGE_QUEUE_TOKEN }}
          AUTONOMOUS_REVIEWER_TOKEN: ${{ secrets.AUTONOMOUS_REVIEWER_TOKEN }}
        run: node tools/review-bridge/reviewer.mjs
